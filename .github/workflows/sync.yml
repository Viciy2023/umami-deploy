name: Sync Umami image

# 为什么存在：飞牛（FNOS）直连 ghcr.io 拉 umami 官方镜像会卡死 ——
# 认证能过（返回 401 是 registry 的正常未认证应答），但镜像层所在的主机
# pkg-containers.githubusercontent.com 拉不动，docker pull 会长时间停在 Waiting。
#
# 本质差别在加速源：飞牛配了 5 个 registry-mirrors，但它们都是 Docker Hub 的
# mirror，按 Docker 的设计只对 docker.io 生效；ghcr.io 一个兜底的都没有。
# 所以这里同时往两个地方推送，飞牛优先用后者：
#   ghcr.io/viciy2023/umami                 —— 本仓库 GITHUB_TOKEN 直接可用
#   docker.io/<DOCKERHUB_USERNAME>/umami    —— 走飞牛 mirror，最稳
#
# 搬而不是建：Umami 官方已经发布镜像，自己编译是重复劳动，而且要跑完整的
# Next.js 16 + Prisma 7 构建链，既慢又容易失败。docker buildx imagetools create
# 在两个 registry 之间直接复制 manifest，不落盘、保留多架构，
# 复制出来的 digest 与官方完全一致。

on:
  schedule:
    # 每 6 小时一次；UTC 01/07/13/19 = 北京 09/15/21/03 点
    - cron: '0 1,7,13,19 * * *'
  workflow_dispatch:

env:
  UPSTREAM_IMAGE: ghcr.io/umami-software/umami
  UPSTREAM_TAG: postgresql-latest
  TARGET_IMAGE: ghcr.io/viciy2023/umami

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      changed: ${{ steps.compare.outputs.changed }}
      digest: ${{ steps.compare.outputs.digest }}
    steps:
      - name: Checkout deploy repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 读取上游 digest 并与本地指纹比对
        id: compare
        run: |
          DIGEST=$(docker buildx imagetools inspect "${UPSTREAM_IMAGE}:${UPSTREAM_TAG}" --format '{{.Manifest.Digest}}')
          LAST=$(cat last-sync.txt 2>/dev/null | tr -d '[:space:]' || echo "")
          echo "upstream: ${DIGEST}"
          echo "local   : ${LAST:-<空>}"
          echo "digest=${DIGEST}" >> "$GITHUB_OUTPUT"
          if [ "${DIGEST}" = "${LAST}" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "上游未变化，跳过同步。"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "检测到变化，准备同步。"
          fi

  sync:
    needs: check
    if: needs.check.outputs.changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - name: Checkout deploy repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 判断 Docker Hub 凭据是否已配置
        id: hub
        run: |
          if [ -n "${{ secrets.DOCKERHUB_TOKEN }}" ] && [ -n "${{ secrets.DOCKERHUB_USERNAME }}" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "Docker Hub 凭据已配置，将同时推送。"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "未配置 Docker Hub 凭据，本次只推送 GHCR。"
          fi

      - name: 登录 GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 登录 Docker Hub
        if: steps.hub.outputs.enabled == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: 取时间戳
        id: stamp
        run: echo "value=$(date -u +%Y%m%d)" >> "$GITHUB_OUTPUT"

      - name: 搬运到 GHCR
        run: |
          docker buildx imagetools create \
            --tag "${TARGET_IMAGE}:latest" \
            --tag "${TARGET_IMAGE}:${{ steps.stamp.outputs.value }}" \
            "${UPSTREAM_IMAGE}:${UPSTREAM_TAG}"
          echo "GHCR 已同步：${TARGET_IMAGE}:latest"

      - name: 搬运到 Docker Hub（走飞牛 mirror 那条路）
        if: steps.hub.outputs.enabled == 'true'
        run: |
          docker buildx imagetools create \
            --tag "docker.io/${{ secrets.DOCKERHUB_USERNAME }}/umami:latest" \
            --tag "docker.io/${{ secrets.DOCKERHUB_USERNAME }}/umami:${{ steps.stamp.outputs.value }}" \
            "${UPSTREAM_IMAGE}:${UPSTREAM_TAG}"
          echo "Docker Hub 已同步：docker.io/${{ secrets.DOCKERHUB_USERNAME }}/umami:latest"

      - name: 记录指纹
        run: echo "${{ needs.check.outputs.digest }}" > last-sync.txt

      - name: 提交指纹
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add last-sync.txt
          if git diff --staged --quiet; then
            echo "无变化可提交。"
          else
            git commit -m "sync: 同步 umami 镜像 $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            git pull --rebase origin main
            git push
          fi
